<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация документов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Учет документов</h1>

    <!-- Навигация по справочникам -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#docs">Документы</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#types">Типы документов</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#emps">Сотрудники</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#prods">Товары</a></li>
    </ul>

    <div class="tab-content mt-3">
        <!-- Вкладка Документов -->
        <div class="tab-pane fade show active" id="docs">
            <button class="btn btn-primary mb-2" onclick="showDocForm()">Новый документ</button>
            <table class="table table-bordered" id="docsTable">
                <thead>
                    <tr><th>Номер</th><th>Дата</th><th>Тип</th><th>Сотрудник</th><th>Операций</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Вкладка Типов -->
        <div class="tab-pane fade" id="types">
            <button class="btn btn-primary mb-2" onclick="addType()">Добавить тип</button>
            <table class="table table-bordered" id="typesTable">
                <thead><tr><th>Название</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Вкладка Сотрудников -->
        <div class="tab-pane fade" id="emps">
            <button class="btn btn-primary mb-2" onclick="addEmployee()">Добавить сотрудника</button>
            <table class="table table-bordered" id="empsTable">
                <thead><tr><th>Имя</th><th>Должность</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Вкладка Товаров -->
        <div class="tab-pane fade" id="prods">
            <button class="btn btn-primary mb-2" onclick="addProduct()">Добавить товар</button>
            <table class="table table-bordered" id="prodsTable">
                <thead><tr><th>Название</th><th>Остаток</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно для формы документа -->
    <div class="modal fade" id="docModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Документ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="docId">
                    <div class="row mb-2">
                        <div class="col"><input class="form-control" id="docNumber" placeholder="Номер"></div>
                        <div class="col"><input class="form-control" type="date" id="docDate"></div>
                    </div>
                    <div class="row mb-2">
                        <div class="col">
                            <select class="form-select" id="docType"></select>
                        </div>
                        <div class="col">
                            <select class="form-select" id="docEmployee"></select>
                        </div>
                    </div>
                    <h6>Позиции документа</h6>
                    <table class="table table-sm" id="opsTable">
                        <thead>
                            <tr><th>Товар</th><th>Тип</th><th>Количество</th><th></th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <button class="btn btn-sm btn-secondary" onclick="addOpRow()">+ Добавить позицию</button>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="saveDocument()">Сохранить</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'http://localhost:5000/api';

// Глобальные данные для заполнения select'ов
let allTypes = [], allEmployees = [], allProducts = [];

// Загрузка справочников
async function loadReferences() {
    allTypes = await fetch(API+'/documenttypes').then(r=>r.json());
    allEmployees = await fetch(API+'/employees').then(r=>r.json());
    allProducts = await fetch(API+'/products').then(r=>r.json());
}

// Обновление всех таблиц на справочных вкладках
async function refreshTypesTab() {
    const data = await fetch(API+'/documenttypes').then(r=>r.json());
    const tbody = document.getElementById('typesTable').querySelector('tbody');
    tbody.innerHTML = data.map(t=>`<tr><td>${t.name}</td><td><button class="btn btn-sm btn-danger" onclick="delType(${t.id})">Удалить</button></td></tr>`).join('');
}
async function refreshEmployeesTab() {
    const data = await fetch(API+'/employees').then(r=>r.json());
    const tbody = document.getElementById('empsTable').querySelector('tbody');
    tbody.innerHTML = data.map(e=>`<tr><td>${e.name}</td><td>${e.position||''}</td><td><button class="btn btn-sm btn-danger" onclick="delEmp(${e.id})">Удалить</button></td></tr>`).join('');
}
async function refreshProductsTab() {
    const data = await fetch(API+'/products').then(r=>r.json());
    const tbody = document.getElementById('prodsTable').querySelector('tbody');
    tbody.innerHTML = data.map(p=>`<tr><td>${p.name}</td><td>${p.quantity}</td><td><button class="btn btn-sm btn-danger" onclick="delProd(${p.id})">Удалить</button></td></tr>`).join('');
}

// Загрузка таблицы документов
async function loadDocs() {
    const docs = await fetch(API+'/documents').then(r=>r.json());
    const tbody = document.querySelector('#docsTable tbody');
    tbody.innerHTML = docs.map(d=>`<tr>
        <td>${d.number}</td><td>${d.date}</td><td>${d.type}</td><td>${d.employee}</td>
        <td>${d.operations_count}</td>
        <td>
            <button class="btn btn-sm btn-info" onclick="editDoc(${d.id})">Ред.</button>
            <button class="btn btn-sm btn-danger" onclick="deleteDoc(${d.id})">Удал.</button>
        </td>
    </tr>`).join('');
}

// Работа с документом
function showDocForm() {
    document.getElementById('docId').value = '';
    document.getElementById('docNumber').value = '';
    document.getElementById('docDate').value = new Date().toISOString().slice(0,10);
    fillDocSelects();
    document.getElementById('opsTable').querySelector('tbody').innerHTML = '';
    new bootstrap.Modal(document.getElementById('docModal')).show();
}

function fillDocSelects() {
    const typeSel = document.getElementById('docType');
    typeSel.innerHTML = allTypes.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
    const empSel = document.getElementById('docEmployee');
    empSel.innerHTML = allEmployees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
}

async function editDoc(id) {
    const doc = await fetch(`${API}/documents/${id}`).then(r=>r.json());
    document.getElementById('docId').value = doc.id;
    document.getElementById('docNumber').value = doc.number;
    document.getElementById('docDate').value = doc.date;
    fillDocSelects();
    document.getElementById('docType').value = doc.type_id;
    document.getElementById('docEmployee').value = doc.employee_id;
    const tbody = document.getElementById('opsTable').querySelector('tbody');
    tbody.innerHTML = '';
    doc.operations.forEach(op=>addOpRow(op.product_id, op.operation_type, op.quantity));
    new bootstrap.Modal(document.getElementById('docModal')).show();
}

function addOpRow(prodId='', opType='in', qty=1) {
    const tbody = document.getElementById('opsTable').querySelector('tbody');
    const row = tbody.insertRow();
    row.innerHTML = `
        <td><select class="form-select">${allProducts.map(p=>`<option value="${p.id}" ${p.id==prodId?'selected':''}>${p.name}</option>`).join('')}</select></td>
        <td><select class="form-select"><option value="in" ${opType=='in'?'selected':''}>Приход</option><option value="out" ${opType=='out'?'selected':''}>Расход</option></select></td>
        <td><input class="form-control" type="number" value="${qty}" min="1"></td>
        <td><button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
}

async function saveDocument() {
    const id = document.getElementById('docId').value;
    const docData = {
        number: document.getElementById('docNumber').value,
        date: document.getElementById('docDate').value,
        type_id: +document.getElementById('docType').value,
        employee_id: +document.getElementById('docEmployee').value,
        operations: []
    };
    const rows = document.querySelectorAll('#opsTable tbody tr');
    rows.forEach(row=>{
        const selects = row.querySelectorAll('select');
        const input = row.querySelector('input');
        docData.operations.push({
            product_id: +selects[0].value,
            operation_type: selects[1].value,
            quantity: +input.value
        });
    });
    const url = id ? `${API}/documents/${id}` : `${API}/documents`;
    const method = id ? 'PUT' : 'POST';
    await fetch(url, {
        method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(docData)
    });
    bootstrap.Modal.getInstance(document.getElementById('docModal')).hide();
    loadDocs();
}

async function deleteDoc(id) {
    if (confirm('Удалить документ?')) {
        await fetch(`${API}/documents/${id}`, {method:'DELETE'});
        loadDocs();
    }
}

// Действия со справочниками
async function addType() {
    const name = prompt('Название типа документа:');
    if (name) {
        await fetch(API+'/documenttypes', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
        await loadReferences();
        refreshTypesTab();
    }
}
async function delType(id) { if (confirm('Удалить тип?')) { await fetch(API+'/documenttypes/'+id,{method:'DELETE'}); refreshTypesTab(); } }
async function addEmployee() {
    const name = prompt('Имя сотрудника:');
    const pos = prompt('Должность:') || '';
    if (name) {
        await fetch(API+'/employees', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,position:pos})});
        await loadReferences(); refreshEmployeesTab();
    }
}
async function delEmp(id) { if (confirm('Удалить сотрудника?')) { await fetch(API+'/employees/'+id,{method:'DELETE'}); refreshEmployeesTab(); } }
async function addProduct() {
    const name = prompt('Название товара:');
    if (name) {
        await fetch(API+'/products', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
        await loadReferences(); refreshProductsTab();
    }
}
async function delProd(id) { if (confirm('Удалить товар?')) { await fetch(API+'/products/'+id,{method:'DELETE'}); refreshProductsTab(); } }

// Инициализация
(async function init() {
    await loadReferences();
    loadDocs();
    refreshTypesTab();
    refreshEmployeesTab();
    refreshProductsTab();
})();
</script>
</body>
</html>
